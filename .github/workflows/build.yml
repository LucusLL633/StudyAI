name: Build StudyAI Unsigned IPA
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Xcode Project
        run: |
          xcodebuild -project ios/StudyAI.xcodeproj \
                     -scheme StudyAI \
                     -configuration Release \
                     -sdk iphoneos \
                     CONFIGURATION_BUILD_DIR=$PWD/build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     clean build

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          mv build/StudyAI.app build/Payload/ || true
          cd build && zip -r StudyAI.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyAI-Unsigned-IPA
          path: build/StudyAI.ipa
